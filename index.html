<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="robots" content="noindex,nofollow">
<title>Ritual Rehearsal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: single column, one screen at a time (Library / Edit / Practice / Read), big thumb targets */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1b2233; --muted:#5d6577; --line:#d9d6cd;
  --blue:#1f3a6e; --blue-ink:#ffffff; --gold:#a8812c; --gold-soft:#f1e6c9;
  --ok:#1e7a46; --ok-bg:#dff1e6; --bad:#b3261e; --bad-bg:#fbe1de; --warn:#8a5a00; --warn-bg:#fdefc9;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1524; --surface:#182036; --ink:#e8e9ee; --muted:#9aa3b8; --line:#2b3550;
  --blue:#3d63b0; --blue-ink:#ffffff; --gold:#d7b25e; --gold-soft:#3a3220;
  --ok:#5fd08e; --ok-bg:#16352a; --bad:#ff8a80; --bad-bg:#40201f; --warn:#f2c35b; --warn-bg:#3a2e12;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:12px;padding-top:14px}
header.top h1{font:700 1.25rem/1.2 var(--display);letter-spacing:.06em;margin:0;flex:1;color:var(--blue)}
@media (prefers-color-scheme:dark){header.top h1{color:var(--gold)}}
.pave{height:8px;border-radius:2px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/8px 8px;opacity:.25}
h2{font:600 1.05rem/1.3 var(--display);letter-spacing:.05em;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
button,.btn{font:600 1rem var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;min-height:48px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
button.gold{background:var(--gold);color:#1b1405;border-color:var(--gold)}
button.ghost{background:transparent;border-color:transparent;color:var(--blue);padding:8px 10px;min-height:40px}
@media (prefers-color-scheme:dark){button.ghost{color:var(--gold)}}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .grow{flex:1;min-width:0}
.item b{display:block;overflow-wrap:anywhere}
label{font-weight:600;font-size:.92rem}
input[type=text],textarea,select{width:100%;font:1rem/1.45 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:46vh;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;font-weight:600}
.chip[aria-pressed=true]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;min-height:44px;padding:8px 6px}
.seg button[aria-pressed=true]{background:var(--blue);color:var(--blue-ink)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:400}
.toggle input{width:22px;height:22px;accent-color:var(--blue)}
.who{font:700 .78rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.cue{border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.mine{font-size:1.2rem;line-height:1.6;overflow-wrap:anywhere}
.secret{display:inline-block;min-width:1.6em;padding:0 .3em;border-radius:6px;background:var(--gold-soft);color:var(--gold);font-weight:700;text-align:center}
.hiddenline{letter-spacing:.2em;color:var(--muted)}
.w{border-radius:4px;padding:0 2px}
.w.ok{color:var(--ok)} .w.close{color:var(--warn);background:var(--warn-bg)}
.w.miss{color:var(--bad);background:var(--bad-bg);text-decoration:underline wavy}
.w.wrong{color:var(--bad);background:var(--bad-bg)}
.w sub{font-size:.7em;color:var(--muted);margin-left:2px}
.score{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.good{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.mid{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.low{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.mic{width:96px;height:96px;border-radius:50%;font-size:2.2rem;align-self:center;background:var(--blue);color:var(--blue-ink);border:none;display:grid;place-items:center}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.5)}100%{box-shadow:0 0 0 22px rgba(179,38,30,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.heard{min-height:1.5em;font-style:italic;color:var(--muted);overflow-wrap:anywhere}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--gold)}
.note{font-size:.9rem;background:var(--gold-soft);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
.readline{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.readline.me{background:var(--gold-soft);margin:0 -10px;padding:8px 10px;border-radius:8px;border:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:.9em}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="scanFile" accept="image/*" capture="environment" hidden>

<script>
'use strict';
/* ========== Storage (this phone only) ========== */
const KEY='ritual-rehearsal.v1';
let state={scripts:[],stats:{},settings:{lang:'en-GB',local:true,cues:true,rate:1}};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.scripts)state=Object.assign(state,s,{settings:Object.assign(state.settings,s.settings||{})});}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Could not save on this phone');}}
load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ========== Text helpers ========== */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
// Secret words: anything typed in {curly braces} is cut down to its first letter BEFORE saving.
function maskSecrets(text){return text.replace(/\{([^}]*)\}/g,(m,w)=>{const c=(w.trim()[0]||'?').toUpperCase();return '{'+c+'}';});}
function parseScript(raw){
  const lines=[];let cur=null;
  maskSecrets(raw).split(/\r?\n/).forEach(l=>{
    const t=l.trim(); if(!t)return;
    const m=t.match(/^([A-Za-z][A-Za-z0-9 .'&\-]{0,24}?)\s*:\s*(.+)$/);
    if(m){cur={who:m[1].trim().toUpperCase(),text:m[2].trim()};lines.push(cur);}
    else if(cur){cur.text+=' '+t;}
    else{cur={who:'?',text:t};lines.push(cur);}
  });
  return lines;
}
function toRaw(lines){return lines.map(l=>l.who+': '+l.text).join('\n');}
function speakers(lines){const s=[];lines.forEach(l=>{if(!s.includes(l.who))s.push(l.who)});return s;}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
const NUM={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','1st':'first','2nd':'second','3rd':'third'};
function norm(w){w=w.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]/g,'');return NUM[w]||w;}
// Tokens of a stored line for display + checking
function tokens(text){
  return text.split(/\s+/).filter(Boolean).map(raw=>{
    const m=raw.match(/^([^{]*)\{(.)\}(.*)$/);
    if(m)return{raw,secret:true,letter:m[2],pre:m[1],post:m[3],n:''};
    return{raw,secret:false,n:norm(raw)};
  }).filter(t=>t.secret||t.n);
}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function similar(a,b){if(a===b)return 'ok';const L=Math.max(a.length,b.length);const d=lev(a,b);const tol=L>=7?2:L>=4?1:0;return d<=tol?'close':null;}

/* Word-by-word alignment of what was said against the line (edit-distance DP).
   Secret words are optional: say them, mouth them or skip them — never penalised. */
function compare(text,spoken){
  const E=tokens(text);const H=spoken.split(/\s+/).map(norm).filter(Boolean);
  const n=E.length,m=H.length,INF=1e9;
  const D=Array.from({length:n+1},()=>new Array(m+1).fill(INF));const B=Array.from({length:n+1},()=>new Array(m+1));
  D[0][0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    const cur=D[i][j];if(cur>=INF)continue;
    if(i<n){const e=E[i];const c=cur+(e.secret?0:1);if(c<D[i+1][j]){D[i+1][j]=c;B[i+1][j]=['del'];}}
    if(j<m){const c=cur+1;if(c<D[i][j+1]){D[i][j+1]=c;B[i][j+1]=['ins'];}}
    if(i<n&&j<m){const e=E[i];let c,k;
      if(e.secret){c=cur+(H[j][0]===e.letter.toLowerCase()?0:0.3);k='secret';}
      else{const s=similar(e.n,H[j]);if(s==='ok'){c=cur;k='ok';}else if(s==='close'){c=cur+0.25;k='close';}else{c=cur+1.2;k='wrong';}}
      if(c<D[i+1][j+1]){D[i+1][j+1]=c;B[i+1][j+1]=[k,H[j]];}}
  }
  const out=new Array(n);const extra=[];let i=n,j=m;
  while(i>0||j>0){const b=B[i][j];if(!b)break;
    if(b[0]==='del'){i--;out[i]={t:E[i],k:E[i].secret?'secret':'miss'};}
    else if(b[0]==='ins'){j--;extra.unshift(H[j]);}
    else{i--;j--;out[i]={t:E[i],k:b[0],heard:b[1]};}}
  const scored=out.filter(o=>!o.t.secret);const good=scored.filter(o=>o.k==='ok'||o.k==='close').length;
  const score=scored.length?Math.round(100*good/scored.length):100;
  return{words:out,extra,score};
}

/* ========== Rendering helpers ========== */
function renderWord(t,mode){
  if(t.secret)return esc(t.pre)+'<span class="secret" title="Secret word">'+esc(t.letter)+'</span>'+esc(t.post);
  if(mode==='letters'){const m=t.raw.match(/^([^A-Za-z0-9]*)([A-Za-z0-9])[A-Za-z0-9'’\-]*(.*)$/);return m?esc(m[1]+m[2]+m[3]):esc(t.raw);}
  return esc(t.raw);
}
function renderLine(text,mode){
  if(mode==='hidden'){const c=tokens(text).length;return '<span class="hiddenline">'+'• '.repeat(Math.min(c,60)).trim()+'</span> <span class="muted small">('+c+' words)</span>';}
  return text.split(/\s+/).filter(Boolean).map(raw=>{const t=tokens(raw)[0];return t?renderWord(t,mode):esc(raw);}).join(' ');
}
function renderResult(r){
  const w=r.words.map(o=>{
    if(o.k==='secret')return renderWord(o.t,'full');
    const label=esc(o.t.raw);
    if(o.k==='wrong')return '<span class="w wrong">'+label+'<sub>'+esc(o.heard)+'</sub></span>';
    return '<span class="w '+o.k+'">'+label+'</span>';
  }).join(' ');
  return w;
}
function pill(score){if(score==null)return '<span class="pill">new</span>';const c=score>=90?'good':score>=70?'mid':'low';return '<span class="pill '+c+'">'+score+'%</span>';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
const $=s=>document.querySelector(s);
const app=document.getElementById('app');
function getScript(id){return state.scripts.find(s=>s.id===id);}
function statFor(s,line){return (state.stats[s.id]||{})[hash(line.who+'|'+line.text)];}
function setStat(s,line,score){const k=hash(line.who+'|'+line.text);state.stats[s.id]=state.stats[s.id]||{};const o=state.stats[s.id][k]||{tries:0,best:0};o.tries++;o.last=score;o.best=Math.max(o.best,score);o.at=Date.now();state.stats[s.id][k]=o;save();}

/* ========== Screens ========== */
let view={name:'home'};
function go(v){stopListening();try{speechSynthesis.cancel()}catch(e){}view=v;render();window.scrollTo(0,0);}
function render(){({home:Home,edit:Edit,practice:Practice,read:Read,settings:Settings})[view.name]();}

function header(title,back){return '<header class="top">'+(back?'<button class="ghost" id="back" aria-label="Back">‹ Back</button>':'')+'<h1>'+esc(title)+'</h1></header><div class="pave" aria-hidden="true"></div>';}
function bindBack(to){const b=$('#back');if(b)b.onclick=()=>go(to||{name:'home'});}

function Home(){
  const items=state.scripts.map(s=>{
    const mine=s.lines.filter(l=>(s.parts||[]).includes(l.who));
    const sc=mine.map(l=>statFor(s,l)).filter(Boolean).map(x=>x.last);
    const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;
    return '<div class="item"><div class="grow"><b>'+esc(s.name)+'</b><span class="muted small">'+s.lines.length+' lines · '+(s.parts&&s.parts.length?'my part: '+esc(s.parts.join(', ')):'no part chosen')+'</span></div>'+pill(avg)+
      '<button class="primary" data-act="practice" data-id="'+s.id+'">Practise</button></div>'+
      '<div class="row" style="margin-top:-6px;justify-content:flex-end"><button class="ghost" data-act="read" data-id="'+s.id+'">Read through</button><button class="ghost" data-act="edit" data-id="'+s.id+'">Edit</button></div>';
  }).join('');
  app.innerHTML=header('Ritual Rehearsal')+
    '<div class="note">🔒 Your words are stored <b>only on this phone</b>. Nothing is uploaded. Secret words are saved as their first letter only.</div>'+
    '<div class="list">'+(items||'<div class="card"><h2>No scripts yet</h2><p class="muted" style="margin:0">Add your first piece of ritual — type it, paste it, or scan a page. Or load the example to see how it works.</p><button id="example">Load example</button></div>')+'</div>'+
    '<button class="primary" id="add">+ Add a script</button>'+
    '<div class="card"><h2>Backup</h2><p class="muted small" style="margin:0">If Chrome clears this site’s data your scripts go with it. Save a backup file to your phone now and then.</p>'+
    '<div class="row"><button class="grow" id="export">Save backup</button><button class="grow" id="import">Restore backup</button></div></div>'+
    '<button class="ghost" id="settings">Settings</button>';
  $('#add').onclick=()=>go({name:'edit',id:null});
  $('#settings').onclick=()=>go({name:'settings'});
  const ex=$('#example');if(ex)ex.onclick=()=>{state.scripts.push({id:uid(),name:'Example (not real ritual)',parts:['JW'],lines:parseScript(EXAMPLE)});save();render();};
  app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>go({name:b.dataset.act,id:b.dataset.id}));
  $('#export').onclick=exportBackup;$('#import').onclick=()=>$('#importFile').click();
}
const EXAMPLE=`WM: Brother Junior Warden, what is the first care of every member of this practice?
JW: To see that the door is properly guarded and the room secure, Worshipful Master.
WM: Direct that duty to be done.
JW: Brother Guard, see that the door is closed and that we are {secure}.
G: The door is closed and the room is secure.
JW: Worshipful Master, the door is closed and all is well.`;

function Edit(){
  const s=view.id?getScript(view.id):null;
  app.innerHTML=header(s?'Edit script':'New script',true)+
    '<div class="card"><label for="name">Name</label><input type="text" id="name" placeholder="e.g. Opening, 1st Degree" value="'+esc(s?s.name:'')+'">'+
    '<label for="raw">Words</label>'+
    '<div class="note small">One line per speech: <code>WM: text</code>, <code>SW: text</code>, <code>Cand: text</code>…<br>Put secret words in curly braces like <code>{word}</code> or just <code>{W}</code> — only the first letter is ever saved.</div>'+
    '<textarea id="raw" spellcheck="false" placeholder="WM: …&#10;SW: …">'+esc(s?toRaw(s.lines):'')+'</textarea>'+
    '<div class="row"><button class="grow" id="scan">📷 Scan a page</button></div>'+
    '<div id="ocr" class="muted small" hidden></div>'+
    '<div id="partsBox"></div>'+
    '<div class="row"><button class="primary grow" id="saveBtn">Save</button></div>'+
    (s?'<div id="delBox"><button class="ghost" id="del" style="color:var(--bad)">Delete this script</button></div>':'')+'</div>';
  bindBack();
  const raw=$('#raw');
  let parts=s?(s.parts||[]).slice():[];
  function drawParts(){
    const sp=speakers(parseScript(raw.value));
    parts=parts.filter(p=>sp.includes(p));
    $('#partsBox').innerHTML=sp.length?'<label>Which part is yours?</label><div class="chips" style="margin-top:6px">'+sp.map(p=>'<button class="chip" aria-pressed="'+parts.includes(p)+'" data-p="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>':'';
    $('#partsBox').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p;parts=parts.includes(p)?parts.filter(x=>x!==p):parts.concat(p);drawParts();});
  }
  raw.addEventListener('input',()=>{clearTimeout(drawParts._t);drawParts._t=setTimeout(drawParts,400);});
  drawParts();
  $('#scan').onclick=()=>$('#scanFile').click();
  $('#scanFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)scanImage(f,raw,drawParts);};
  $('#saveBtn').onclick=()=>{
    const lines=parseScript(raw.value);
    if(!lines.length){toast('Add some words first');return;}
    const name=$('#name').value.trim()||'Untitled';
    if(s){s.name=name;s.lines=lines;s.parts=parts;}else state.scripts.push({id:uid(),name,lines,parts});
    save();toast('Saved on this phone');go({name:'home'});
  };
  const del=$('#del');if(del)del.onclick=()=>{
    $('#delBox').innerHTML='<div class="confirm"><span class="grow">Delete “'+esc(s.name)+'” from this phone?</span><button id="delYes" style="background:var(--bad);color:#fff;border-color:var(--bad)">Delete</button><button id="delNo">Keep</button></div>';
    $('#delYes').onclick=()=>{state.scripts=state.scripts.filter(x=>x!==s);delete state.stats[s.id];save();go({name:'home'});};
    $('#delNo').onclick=()=>Edit();
  };
}

/* Local OCR — the photo is read on this phone (Tesseract runs in the browser), never uploaded */
let tessLoading=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();if(tessLoading)return tessLoading;
  tessLoading=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>{tessLoading=null;rej(new Error('load'));};document.head.appendChild(sc);});return tessLoading;}
async function scanImage(file,raw,after){
  const box=$('#ocr');box.hidden=false;box.textContent='Loading the text reader (first time only)…';
  try{await loadTess();
    const r=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text')box.textContent='Reading page… '+Math.round(m.progress*100)+'%';}});
    const text=r.data.text.replace(/\n{2,}/g,'\n').trim();
    raw.value=(raw.value.trim()?raw.value.trim()+'\n':'')+text;
    box.textContent='Page added. Check it, add speaker labels (WM:, SW: …) and put secret words in {braces}.';after();
  }catch(e){box.textContent='Could not read that photo. Try again in good light, or type the words in.';}
}

/* ========== Speech ========== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,heardFinal='',heardCarry='',onHeard=null;
async function startListening(update){
  if(!SR){toast('Speech recognition isn’t available in this browser. Use Chrome.');return false;}
  heardFinal='';heardCarry='';onHeard=update;listening=true;
  if(state.settings.local){try{
    if(SR.available){const a=await SR.available({langs:[state.settings.lang],processLocally:true});
      if(a==='downloadable'&&SR.install){toast('Downloading on-device speech pack…');await SR.install({langs:[state.settings.lang],processLocally:true});}}
  }catch(e){}}
  begin();return true;
}
function begin(){
  rec=new SR();rec.lang=state.settings.lang;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  if(state.settings.local&&'processLocally' in rec){try{rec.processLocally=true;}catch(e){}}
  rec.onresult=e=>{let fin='',interim='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=' '+r[0].transcript;else interim+=' '+r[0].transcript;}
    heardFinal=(heardCarry+' '+fin).trim();onHeard&&onHeard((heardFinal+' '+interim).trim());};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;toast('Microphone blocked. Allow it in Chrome’s site settings.');onHeard&&onHeard(null);}
    else if(e.error==='language-not-supported'&&rec.processLocally){state.settings.local=false;save();toast('On-device speech not ready — using Chrome’s online service.');}};
  rec.onend=()=>{if(listening){heardCarry=heardFinal;try{begin();}catch(e){}}};
  try{rec.start();}catch(e){}
}
function stopListening(){listening=false;if(rec){try{rec.stop();}catch(e){}}}
function sayCue(text,done){
  try{if(!state.settings.cues||!window.speechSynthesis){done&&done();return;}
    const u=new SpeechSynthesisUtterance(text.replace(/\{(.)\}/g,'$1'));u.lang=state.settings.lang;u.rate=state.settings.rate;
    u.onend=()=>done&&done();u.onerror=()=>done&&done();speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){done&&done();}
}

/* ========== Practice ========== */
let P=null;
function Practice(){
  const s=getScript(view.id);if(!s)return go({name:'home'});
  if(!P||P.id!==s.id)P={id:s.id,mode:'letters',weak:false,pos:0,result:null,heard:'',reveal:false};
  const sp=speakers(s.lines);
  if(!s.parts||!s.parts.length){
    app.innerHTML=header(s.name,true)+'<div class="card"><h2>Which part is yours?</h2><div class="chips">'+sp.map(p=>'<button class="chip" data-p="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div></div>';
    bindBack();app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{s.parts=[b.dataset.p];save();Practice();});return;
  }
  let idx=s.lines.map((l,i)=>i).filter(i=>s.parts.includes(s.lines[i].who));
  if(P.weak){const w=idx.filter(i=>{const st=statFor(s,s.lines[i]);return !st||st.last<90;});if(w.length)idx=w;}
  if(P.pos>=idx.length)P.pos=0;
  const li=idx[P.pos],line=s.lines[li];
  // cues: the lines spoken by others immediately before mine
  const cues=[];for(let k=li-1;k>=0&&!s.parts.includes(s.lines[k].who)&&cues.length<2;k--)cues.unshift(s.lines[k]);
  const st=statFor(s,line);
  const modes=[['full','Full'],['letters','First letters'],['hidden','Hidden']];
  app.innerHTML=header(s.name,true)+
    '<div class="seg" role="group" aria-label="How much to show">'+modes.map(m=>'<button data-mode="'+m[0]+'" aria-pressed="'+(P.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<div class="row"><label class="toggle grow"><input type="checkbox" id="weak" '+(P.weak?'checked':'')+'> Only lines under 90%</label><label class="toggle"><input type="checkbox" id="cuesOn" '+(state.settings.cues?'checked':'')+'> Read cues</label></div>'+
    '<div class="row small muted"><span class="grow">Line '+(P.pos+1)+' of '+idx.length+(P.weak?' (weak lines)':'')+'</span>'+(st?'Last '+pill(st.last)+' · best '+st.best+'%':pill(null))+'</div>'+
    '<div class="progress"><i style="width:'+Math.round(100*(P.pos+1)/idx.length)+'%"></i></div>'+
    '<div class="card">'+
      (cues.length?cues.map(c=>'<div class="cue"><div class="who">'+esc(c.who)+'</div>'+renderLine(c.text,'full')+'</div>').join('')+'<button class="ghost" id="playCue" style="align-self:flex-start">▶ Hear cue</button>':'<div class="muted small">Your part opens here.</div>')+
      '<div><div class="who">'+esc(line.who)+' — you</div><div class="mine" id="mine">'+(P.result?renderResult(P.result):renderLine(line.text,P.reveal?'full':P.mode))+'</div></div>'+
      (P.result?'<div class="row"><span class="score">'+P.result.score+'%</span><span class="muted small grow">'+(P.result.score>=90?'Word perfect, or near enough.':P.result.score>=70?'Close. Red words were missed or wrong.':'Keep at it. Red words were missed or wrong.')+(P.result.extra.length?' '+P.result.extra.length+' extra word'+(P.result.extra.length>1?'s':'')+' heard.':'')+'</span></div>':'')+
      (!P.result&&P.mode!=='full'?'<button class="ghost" id="reveal" style="align-self:flex-start">'+(P.reveal?'Hide':'Peek')+'</button>':'')+
    '</div>'+
    '<button class="mic" id="mic" aria-label="Start speaking">🎙</button>'+
    '<div class="heard" id="heard" aria-live="polite">'+(P.result?'Heard: “'+esc(P.heard)+'”':'Tap the mic, say your line, then tap again to check.')+'</div>'+
    '<div class="row"><button class="grow" id="prev" '+(P.pos===0?'disabled':'')+'>‹ Prev</button>'+(P.result?'<button class="grow" id="again">Try again</button>':'')+'<button class="primary grow" id="next">Next ›</button></div>'+
    (SR?'':'<div class="note">This browser can’t listen. Open the app in Chrome on Android. You can still practise with Peek and self-check.</div>');
  bindBack();
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{P.mode=b.dataset.mode;P.reveal=false;Practice();});
  $('#weak').onchange=e=>{P.weak=e.target.checked;P.pos=0;P.result=null;Practice();};
  $('#cuesOn').onchange=e=>{state.settings.cues=e.target.checked;save();};
  const pc=$('#playCue');if(pc)pc.onclick=()=>{const was=state.settings.cues;state.settings.cues=true;sayCue(cues.map(c=>c.text).join('. '));state.settings.cues=was;};
  const rv=$('#reveal');if(rv)rv.onclick=()=>{P.reveal=!P.reveal;Practice();};
  const move=d=>{P.pos=Math.max(0,P.pos+d);P.result=null;P.reveal=false;P.heard='';stopListening();Practice();
    const s2=getScript(view.id);let id2=s2.lines.map((l,i)=>i).filter(i=>s2.parts.includes(s2.lines[i].who));
    if(P.weak){const w=id2.filter(i=>{const q=statFor(s2,s2.lines[i]);return !q||q.last<90;});if(w.length)id2=w;}
    const l2=id2[P.pos%id2.length];const cs=[];for(let k=l2-1;k>=0&&!s2.parts.includes(s2.lines[k].who)&&cs.length<2;k--)cs.unshift(s2.lines[k]);
    if(cs.length&&d>0)sayCue(cs.map(c=>c.text).join('. '));};
  $('#prev').onclick=()=>move(-1);
  $('#next').onclick=()=>{if(P.pos+1>=idx.length){P.pos=-1;toast('Back to the start');}move(1);};
  const ag=$('#again');if(ag)ag.onclick=()=>{P.result=null;P.heard='';Practice();};
  const mic=$('#mic'),heard=$('#heard');
  mic.onclick=async()=>{
    if(listening){stopListening();mic.classList.remove('on');
      setTimeout(()=>{const said=(heardFinal||P._live||'').trim();
        if(!said){heard.textContent='Didn’t catch anything. Tap the mic and try again.';return;}
        P.heard=said;P.result=compare(line.text,said);setStat(s,line,P.result.score);Practice();},350);
      return;}
    try{speechSynthesis.cancel();}catch(e){}
    P._live='';P.result=null;
    const ok=await startListening(t=>{if(t===null){mic.classList.remove('on');return;}P._live=t;heard.textContent=t||'Listening…';});
    if(ok){mic.classList.add('on');mic.setAttribute('aria-label','Stop and check');heard.textContent='Listening… tap again when you’ve finished.';
      if(P.result===null&&$('#mine'))$('#mine').innerHTML=renderLine(line.text,P.mode);}
  };
}

/* ========== Read through ========== */
let readMode='full';
function Read(){
  const s=getScript(view.id);if(!s)return go({name:'home'});
  app.innerHTML=header(s.name,true)+
    '<div class="seg" role="group">'+[['full','Full'],['letters','First letters'],['hidden','Hide mine']].map(m=>'<button data-mode="'+m[0]+'" aria-pressed="'+(readMode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<div class="card">'+s.lines.map(l=>{const me=(s.parts||[]).includes(l.who);const st=me?statFor(s,l):null;
      return '<div class="readline'+(me?' me':'')+'"><div class="row"><span class="who grow">'+esc(l.who)+'</span>'+(me?pill(st?st.last:null):'')+'</div><div>'+renderLine(l.text,me?readMode:(readMode==='letters'?'letters':'full'))+'</div></div>';}).join('')+'</div>';
  bindBack();
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{readMode=b.dataset.mode;Read();});
}

/* ========== Settings ========== */
function Settings(){
  const st=state.settings;
  const voices=(()=>{try{return speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'))}catch(e){return[]}})();
  app.innerHTML=header('Settings',true)+
    '<div class="card"><label class="toggle"><input type="checkbox" id="local" '+(st.local?'checked':'')+'> Prefer on-device speech recognition</label>'+
    '<p class="muted small" style="margin:0">When Chrome supports it, your voice is processed on the phone. Otherwise Chrome sends the audio to Google to turn it into words. Your scripts are never sent anywhere.</p></div>'+
    '<div class="card"><label for="lang">Accent</label><select id="lang">'+[['en-GB','English (UK)'],['en-US','English (US)'],['en-IE','English (Ireland)'],['en-AU','English (Australia)']].map(o=>'<option value="'+o[0]+'"'+(st.lang===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
    '<label for="rate">Cue reading speed</label><input type="range" id="rate" min="0.6" max="1.4" step="0.1" value="'+st.rate+'"></div>'+
    '<div class="card"><h2>Tips</h2><ul class="small" style="margin:0;padding-left:1.2em"><li>Secret words show as a gold letter. Say them, mouth them or skip them — they never count against you.</li><li>Unusual words may be misheard. Amber words were close enough to count.</li><li>Add to your home screen: Chrome menu ⋮ → Add to Home screen.</li></ul></div>';
  bindBack();
  $('#local').onchange=e=>{st.local=e.target.checked;save();};
  $('#lang').onchange=e=>{st.lang=e.target.value;save();};
  $('#rate').onchange=e=>{st.rate=parseFloat(e.target.value);save();};
}

/* ========== Backup ========== */
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'ritual-rehearsal',v:1,saved:new Date().toISOString(),...state},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ritual-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('Backup saved to Downloads');
}
$('#importFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.scripts))throw 0;
    const have=new Set(state.scripts.map(s=>s.id));d.scripts.forEach(s=>{s.lines=s.lines.map(l=>({who:l.who,text:maskSecrets(l.text)}));if(!have.has(s.id))state.scripts.push(s);});
    state.stats=Object.assign({},d.stats||{},state.stats);save();toast('Restored '+d.scripts.length+' script(s)');render();}catch(err){toast('That file isn’t a Ritual Rehearsal backup');}};r.readAsText(f);};

try{speechSynthesis.onvoiceschanged=()=>{};}catch(e){}
// Offline: cache the app itself (never your words — those live in this phone's storage)
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
</script>
