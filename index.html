<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="robots" content="noindex,nofollow">
<title>Ritual Rehearsal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: single column, one screen at a time (Library / Edit / Practice / Read), big thumb targets */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1b2233; --muted:#5d6577; --line:#d9d6cd;
  --blue:#1f3a6e; --blue-ink:#ffffff; --gold:#a8812c; --gold-soft:#f1e6c9;
  --ok:#1e7a46; --ok-bg:#dff1e6; --bad:#b3261e; --bad-bg:#fbe1de; --warn:#8a5a00; --warn-bg:#fdefc9;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1524; --surface:#182036; --ink:#e8e9ee; --muted:#9aa3b8; --line:#2b3550;
  --blue:#3d63b0; --blue-ink:#ffffff; --gold:#d7b25e; --gold-soft:#3a3220;
  --ok:#5fd08e; --ok-bg:#16352a; --bad:#ff8a80; --bad-bg:#40201f; --warn:#f2c35b; --warn-bg:#3a2e12;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;gap:12px;padding-top:14px}
header.top h1{font:700 1.25rem/1.2 var(--display);letter-spacing:.06em;margin:0;flex:1;color:var(--blue)}
@media (prefers-color-scheme:dark){header.top h1{color:var(--gold)}}
.pave{height:8px;border-radius:2px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/8px 8px;opacity:.25}
h2{font:600 1.05rem/1.3 var(--display);letter-spacing:.05em;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
button,.btn{font:600 1rem var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;min-height:48px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
button.gold{background:var(--gold);color:#1b1405;border-color:var(--gold)}
button.ghost{background:transparent;border-color:transparent;color:var(--blue);padding:8px 10px;min-height:40px}
@media (prefers-color-scheme:dark){button.ghost{color:var(--gold)}}
button:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .grow{flex:1;min-width:0}
.item b{display:block;overflow-wrap:anywhere}
label{font-weight:600;font-size:.92rem}
input[type=text],textarea,select{width:100%;font:1rem/1.45 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:46vh;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;font-weight:600}
.chip[aria-pressed=true]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;min-height:44px;padding:8px 6px}
.seg button[aria-pressed=true]{background:var(--blue);color:var(--blue-ink)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:400}
.toggle input{width:22px;height:22px;accent-color:var(--blue)}
.who{font:700 .78rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.cue{border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.mine{font-size:1.2rem;line-height:1.6;overflow-wrap:anywhere}
.secret{display:inline-block;min-width:1.6em;padding:0 .3em;border-radius:6px;background:var(--gold-soft);color:var(--gold);font-weight:700;text-align:center}
.hiddenline{letter-spacing:.2em;color:var(--muted)}
.w{border-radius:4px;padding:0 2px}
.w.ok{color:var(--ok)} .w.close{color:var(--warn);background:var(--warn-bg)}
.w.miss{color:var(--bad);background:var(--bad-bg);text-decoration:underline wavy}
.w.wrong{color:var(--bad);background:var(--bad-bg)}
.w sub{font-size:.7em;color:var(--muted);margin-left:2px}
.score{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.good{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.mid{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.low{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.mic{width:96px;height:96px;border-radius:50%;font-size:2.2rem;align-self:center;background:var(--blue);color:var(--blue-ink);border:none;display:grid;place-items:center}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.5)}100%{box-shadow:0 0 0 22px rgba(179,38,30,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.heard{min-height:1.5em;font-style:italic;color:var(--muted);overflow-wrap:anywhere}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--gold)}
.note{font-size:.9rem;background:var(--gold-soft);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
.readline{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.readline.me{background:var(--gold-soft);margin:0 -10px;padding:8px 10px;border-radius:8px;border:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px}
code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:.9em}
:root{--red:#b8322a}
@media (prefers-color-scheme:dark){:root{--red:#ff8f7a}}
.act{color:var(--red);font-style:italic;font-size:.92em}
.mine .act{font-size:.8em}
.knock{display:inline-flex;align-items:center;gap:1px;color:var(--ink);vertical-align:-0.15em;white-space:nowrap}
.knock svg{width:1.15em;height:1.15em}
.knock b{font-size:.75em;margin-left:2px;color:var(--muted)}
.dir{color:var(--red);font-style:italic;padding:6px 0}
.skipbar{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;background:var(--bg);border:1px dashed var(--line);color:var(--muted);font-weight:600;min-height:40px;border-radius:8px;margin:6px 0}
.skipnote{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.gavelpad{display:flex;flex-direction:column;align-items:center;gap:8px}
.gavelbtn{width:120px;height:72px;border-radius:14px;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.gavelbtn svg{width:44px;height:44px}
.gavelbtn.hit{transform:scale(.94);background:var(--gold-soft)}
.taps{font:700 1.4rem var(--display);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,14,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:12px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet textarea{min-height:30vh}
.editable{cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="scanFile" accept="image/*" multiple hidden>

<script>
'use strict';
/* ========== Storage (this phone only) ========== */
const KEY='ritual-rehearsal.v1';
let state={scripts:[],stats:{},settings:{lang:'en-GB',local:true,cues:true,rate:1,sound:true}};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.scripts)state=Object.assign(state,s,{settings:Object.assign(state.settings,s.settings||{})});}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Could not save on this phone');}}
load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ========== Script format ==========
   WM — Brethren, assist me to open the Lodge.      spoken words after the dash
   JW [names IG] — Bro ......, see that ...          [square brackets] = actions (red, never checked)
   WM (1k)                                           (1k) / (3k) = gavel knocks
   [The Brethren assemble in their places.]          a line in brackets = stage direction
   {word}                                            secret word, saved as first letter only
   ......                                            a name, e.g. Bro ......  (say any name)
*/
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function maskSecrets(text){return text.replace(/\{([^}]*)\}/g,(m,w)=>'{'+((w.trim()[0]||'?').toUpperCase())+'}');}
const SPK=/^\*?\s*([A-Z][A-Za-z.'&]{0,11}(?:\s[A-Z][A-Za-z.]{0,11})?)\s*,?\s*(?:[:—–]|-\s|(?=\[|\(\d+\s*k\)))\s*(.*)$/;
function parseScript(raw){
  const lines=[];let cur=null;
  maskSecrets(raw).split(/\r?\n/).forEach(l=>{
    const t=l.trim().replace(/^\*\s*/,'').replace(/\*$/,''); if(!t)return;
    if(t[0]==='#'){cur=null;lines.push({who:'#',text:t.replace(/^#+\s*/,'')});return;}
    if(t[0]==='['){cur={who:'',text:t};lines.push(cur);return;}
    const m=t.match(SPK);
    if(m){cur={who:m[1].trim().toUpperCase().replace(/\.$/,''),text:m[2].trim()};lines.push(cur);}
    else if(cur){cur.text+=' '+t;}
    else{cur={who:'',text:t.startsWith('[')?t:'['+t+']'};lines.push(cur);}
  });
  return lines;
}
function toRaw(lines){return lines.map(l=>l.who==='#'?'# '+l.text:l.who?l.who+(l.text.startsWith('[')||/^\(\d+\s*k\)/.test(l.text)?' ':' — ')+l.text:l.text).join('\n');}
function speakers(lines){const s=[];lines.forEach(l=>{if(l.who&&l.who!=='#'&&!s.includes(l.who))s.push(l.who)});return s;}
function sections(s){const out=[];let cur=null;s.lines.forEach((l,i)=>{if(l.who==='#'){cur={name:l.text,start:i+1,end:i+1};out.push(cur);}else{if(!cur){cur={name:'Beginning',start:i,end:i};out.push(cur);}cur.end=i+1;}});return out.filter(x=>x.end>x.start);}
function rangeOf(s,sec){if(sec==null)return [0,s.lines.length];const x=sections(s)[sec];return x?[x.start,x.end]:[0,s.lines.length];}
function avgScore(s,lo,hi){const sc=[];for(let i=lo;i<hi;i++){const l=s.lines[i];if(isMine(s,l)){const st=statFor(s,l);if(st)sc.push(st.last);}}return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;}
function countMine(s,lo,hi){let n=0;for(let i=lo;i<hi;i++)if(isMine(s,s.lines[i]))n++;return n;}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
const NUM={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','1st':'first','2nd':'second','3rd':'third','bro':'brother','bros':'brethren','wm':'worshipful','w':'worshipful'};
function norm(w){w=w.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]/g,'');return NUM[w]||w;}
function tokens(text){
  const out=[];const re=/\[([^\]]*)\]|\((\d+)\s*k\)|(\S+)/g;let m;
  while((m=re.exec(text))){
    if(m[1]!=null){out.push({kind:'act',raw:m[1]});continue;}
    if(m[2]){out.push({kind:'knock',n:+m[2]});continue;}
    const raw=m[3];const s=raw.match(/^([^{]*)\{(.)\}(.*)$/);
    if(s)out.push({kind:'word',raw,secret:true,opt:true,letter:s[2],pre:s[1],post:s[3],n:''});
    else if(/(\.{3,}|…)/.test(raw)&&!/[A-Za-z]/.test(raw))out.push({kind:'word',raw,name:true,opt:true,n:''});
    else{const n=norm(raw);out.push(n?{kind:'word',raw,n}:{kind:'punct',raw});}
  }
  return out;
}
const words=t=>tokens(t).filter(x=>x.kind==='word');
const knockTotal=t=>tokens(t).filter(x=>x.kind==='knock').reduce((a,b)=>a+b.n,0);
const isSpoken=l=>l.who&&l.who!=='#'&&(words(l.text).length||knockTotal(l.text));
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function similar(a,b){if(a===b)return 'ok';const L=Math.max(a.length,b.length);const d=lev(a,b);const tol=L>=7?2:L>=4?1:0;return d<=tol?'close':null;}

/* Word-by-word alignment (edit-distance DP). Secret words and names are optional. */
function compare(text,spoken){
  const E=words(text);const H=spoken.split(/\s+/).map(norm).filter(Boolean);
  const n=E.length,m=H.length,INF=1e9;
  const D=Array.from({length:n+1},()=>new Array(m+1).fill(INF));const B=Array.from({length:n+1},()=>new Array(m+1));
  D[0][0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    const cur=D[i][j];if(cur>=INF)continue;
    if(i<n){const c=cur+(E[i].opt?0:1);if(c<D[i+1][j]){D[i+1][j]=c;B[i+1][j]=['del'];}}
    if(j<m){const c=cur+1;if(c<D[i][j+1]){D[i][j+1]=c;B[i][j+1]=['ins'];}}
    if(i<n&&j<m){const e=E[i];let c,k;
      if(e.secret){c=cur+(H[j][0]===e.letter.toLowerCase()?0:0.3);k='secret';}
      else if(e.name){c=cur+0.1;k='name';}
      else{const s=similar(e.n,H[j]);if(s==='ok'){c=cur;k='ok';}else if(s==='close'){c=cur+0.25;k='close';}else{c=cur+1.2;k='wrong';}}
      if(c<D[i+1][j+1]){D[i+1][j+1]=c;B[i+1][j+1]=[k,H[j]];}}
  }
  const out=new Array(n);const extra=[];let i=n,j=m;
  while(i>0||j>0){const b=B[i][j];if(!b)break;
    if(b[0]==='del'){i--;out[i]={k:E[i].secret?'secret':E[i].name?'name':'miss'};}
    else if(b[0]==='ins'){j--;extra.unshift(H[j]);}
    else{i--;j--;out[i]={k:b[0],heard:b[1]};}}
  const scored=E.map((e,x)=>[e,out[x]]).filter(p=>!p[0].opt);const good=scored.filter(p=>p[1].k==='ok'||p[1].k==='close').length;
  return{res:out,extra,score:scored.length?Math.round(100*good/scored.length):100};
}

/* ========== Rendering ========== */
const GAVEL='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><g transform="rotate(-40 10 9)"><rect x="4" y="3" width="12" height="6.5" rx="1.6"/><rect x="8.8" y="9" width="2.4" height="11" rx="1.1"/></g><rect x="12" y="20.5" width="10" height="2.5" rx="1"/></svg>';
function knockHtml(n,mode){if(mode==='hidden')return '<span class="knock" title="Knocks">'+GAVEL+'<b>?</b></span>';return '<span class="knock" title="'+n+' knock'+(n>1?'s':'')+'">'+GAVEL.repeat(Math.min(n,5))+'<b>×'+n+'</b></span>';}
function wordHtml(t,mode){
  if(t.secret)return esc(t.pre)+'<span class="secret" title="Secret word">'+esc(t.letter)+'</span>'+esc(t.post);
  if(t.name)return '<span class="muted">…</span>';
  if(mode==='letters'){const m=t.raw.match(/^([^A-Za-z0-9]*)([A-Za-z0-9])[A-Za-z0-9'’\-]*(.*)$/);return m?esc(m[1]+m[2]+m[3]):esc(t.raw);}
  return esc(t.raw);
}
// mode: full | letters | hidden ; res: optional compare result for word colouring
function renderLine(text,mode,res){
  const T=tokens(text);let wi=0;const parts=[];let hiddenRun=0;
  const flush=()=>{if(hiddenRun){parts.push('<span class="hiddenline">'+'• '.repeat(Math.min(hiddenRun,40)).trim()+'</span>');hiddenRun=0;}};
  T.forEach(t=>{
    if(t.kind==='act'){flush();parts.push('<span class="act">'+esc(t.raw)+'</span>');return;}
    if(t.kind==='knock'){flush();parts.push(knockHtml(t.n,res?'full':mode));return;}
    if(t.kind==='punct'){if(mode!=='hidden'||res)parts.push(esc(t.raw));return;}
    const r=res?res.res[wi]:null;wi++;
    if(r){if(r.k==='secret'||r.k==='name'){parts.push(wordHtml(t,'full'));return;}
      parts.push(r.k==='wrong'?'<span class="w wrong">'+esc(t.raw)+'<sub>'+esc(r.heard)+'</sub></span>':'<span class="w '+r.k+'">'+esc(t.raw)+'</span>');return;}
    if(mode==='hidden'&&!t.secret){hiddenRun++;return;}
    parts.push(wordHtml(t,mode));
  });flush();
  return parts.join(' ');
}
function pill(score){if(score==null)return '<span class="pill">new</span>';const c=score>=90?'good':score>=70?'mid':'low';return '<span class="pill '+c+'">'+score+'%</span>';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
const $=s=>document.querySelector(s);
const app=document.getElementById('app');
function getScript(id){return state.scripts.find(s=>s.id===id);}
function statFor(s,line){return (state.stats[s.id]||{})[hash(line.who+'|'+line.text)];}
function setStat(s,line,score){const k=hash(line.who+'|'+line.text);state.stats[s.id]=state.stats[s.id]||{};const o=state.stats[s.id][k]||{tries:0,best:0};o.tries++;o.last=score;o.best=Math.max(o.best,score);o.at=Date.now();state.stats[s.id][k]=o;save();}
const isMine=(s,l)=>!!l.who&&(s.parts||[]).includes(l.who)&&isSpoken(l);

/* ========== Screens ========== */
let view={name:'home'};
function go(v){stopListening();try{speechSynthesis.cancel()}catch(e){}view=v;render();window.scrollTo(0,0);}
function render(){({home:Home,ceremony:Ceremony,edit:Edit,practice:Practice,rehearse:Rehearse,read:Read,settings:Settings})[view.name]();}
function header(title,back){return '<header class="top">'+(back?'<button class="ghost" id="back" aria-label="Back">‹ Back</button>':'')+'<h1>'+esc(title)+'</h1></header><div class="pave" aria-hidden="true"></div>';}
function bindBack(to){const b=$('#back');if(b)b.onclick=()=>go(to||{name:'home'});}

function Home(){
  const items=state.scripts.map(s=>{
    const n=countMine(s,0,s.lines.length),secs=sections(s).length;
    return '<div class="item"><div class="grow"><b>'+esc(s.name)+'</b><span class="muted small">'+secs+' section'+(secs===1?'':'s')+' · '+n+' of my lines · '+(s.parts&&s.parts.length?esc(s.parts.join(', ')):'no part chosen')+'</span></div>'+pill(avgScore(s,0,s.lines.length))+
      '<button class="primary" data-act="ceremony" data-id="'+s.id+'">Open</button></div>';
  }).join('');
  app.innerHTML=header('Ritual Rehearsal')+

/* ========== Practice ========== */
let P=null;
function myIdx(s){const [lo,hi]=rangeOf(s,view.sec);let idx=s.lines.map((l,i)=>i).filter(i=>i>=lo&&i<hi&&isMine(s,s.lines[i]));
  if(P.weak){const w=idx.filter(i=>{const st=statFor(s,s.lines[i]);return !st||st.last<90;});if(w.length)idx=w;}return idx;}
function cuesFor(s,li){
  // walk back to the last spoken line by someone else; keep directions in between; count what was skipped
  const shown=[];let k=li-1;const lo=rangeOf(s,view.sec)[0];
  for(;k>=lo&&!isMine(s,s.lines[k])&&s.lines[k].who!=='#';k--){shown.unshift(s.lines[k]);if(isSpoken(s.lines[k]))break;}
  let prevMine=k-1;while(prevMine>=lo&&!isMine(s,s.lines[prevMine]))prevMine--;
  const skipped=Math.max(0,(k-1)-prevMine);
  return{shown,skipped};
}
function secTitle(s){return view.sec==null?s.name:((sections(s)[view.sec]||{}).name||s.name);}
function Practice(){
  const s=getScript(view.id);if(!s)return go({name:'home'});
  if(!P||P.id!==s.id||P.sec!==view.sec)P={id:s.id,sec:view.sec,mode:P&&P.id===s.id?P.mode:'letters',weak:false,pos:0,result:null,heard:'',reveal:false,taps:0};

    app.innerHTML=header(secTitle(s),true)+'<div class="card"><h2>Which part is yours?</h2><div class="chips">'+sp.map(p=>'<button class="chip" data-p="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div></div>';
    bindBack({name:'ceremony',id:s.id});app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{s.parts=[b.dataset.p];save();Practice();});return;
  }
  const idx=myIdx(s);

  if(P.pos>=idx.length)P.pos=0;
  const li=idx[P.pos],line=s.lines[li];
  const {shown,skipped}=cuesFor(s,li);
  const st=statFor(s,line);
  const nWords=words(line.text).filter(w=>!w.opt).length, nKnocks=knockTotal(line.text);
  const modes=[['full','Full'],['letters','First letters'],['hidden','Hidden']];

    '<div class="seg" role="group" aria-label="How much to show">'+modes.map(m=>'<button data-mode="'+m[0]+'" aria-pressed="'+(P.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<div class="row"><label class="toggle grow"><input type="checkbox" id="weak" '+(P.weak?'checked':'')+'> Only lines under 90%</label><label class="toggle"><input type="checkbox" id="cuesOn" '+(state.settings.cues?'checked':'')+'> Read cues</label></div>'+
    '<div class="row small muted"><span class="grow">My line '+(P.pos+1)+' of '+idx.length+(P.weak?' (weak lines)':'')+'</span>'+(st?'Last '+pill(st.last)+' · best '+st.best+'%':pill(null))+'</div>'+
    '<div class="progress"><i style="width:'+Math.round(100*(P.pos+1)/idx.length)+'%"></i></div>'+
    '<div class="card">'+
      (skipped?'<div class="skipnote">⏭ Skipped '+skipped+' line'+(skipped>1?'s':'')+' you’re not in</div>':'')+
      (shown.length?shown.map(c=>c.who?'<div class="cue"><div class="who">'+esc(c.who)+'</div>'+renderLine(c.text,'full')+'</div>':'<div class="dir">'+renderLine(c.text,'full')+'</div>').join('')+(shown.some(isSpoken)?'<button class="ghost" id="playCue" style="align-self:flex-start">▶ Hear cue</button>':''):'<div class="muted small">Your part opens here.</div>')+
      '<div><div class="who">'+esc(line.who)+' (you)</div><div class="mine" id="mine">'+renderLine(line.text,shownMode,P.result)+'</div></div>'+

      '<div class="row">'+(!P.result&&P.mode!=='full'?'<button class="ghost" id="reveal">'+(P.reveal?'Hide':'Peek')+'</button>':'')+'<span class="grow"></span><button class="ghost" id="editL">✎ Edit line</button></div>'+
    '</div>'+
    (nKnocks?'<div class="gavelpad"><button class="gavelbtn" id="gavel" aria-label="Knock">'+GAVEL+'</button><div class="row"><span class="taps" id="taps">'+P.taps+'</span><span class="muted small">knock'+(P.taps===1?'':'s')+' given</span><button class="ghost" id="tapReset">Reset</button></div></div>':'')+

  bindBack({name:'ceremony',id:s.id});
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{P.mode=b.dataset.mode;P.reveal=false;Practice();});
  $('#weak').onchange=e=>{P.weak=e.target.checked;P.pos=0;P.result=null;P.taps=0;Practice();};
  $('#cuesOn').onchange=e=>{state.settings.cues=e.target.checked;save();};
  const pc=$('#playCue');if(pc)pc.onclick=()=>sayCue(cueText(shown),true);

  const finish=(said)=>{

    if(nKnocks){msgs.push(knocksOK?'Knocks right ('+nKnocks+').':'Knocks: you gave '+P.taps+', should be '+nKnocks+'.');score=nWords?Math.round(r.score*0.8+(knocksOK?20:0)):(knocksOK?100:0);}

    $('#tapReset').onclick=()=>{P.taps=0;$('#taps').textContent=0;};}
  const ck=$('#checkKnocks');if(ck)ck.onclick=()=>finish('');
  const mic=$('#mic'),heard=$('#heard');
  if(mic)mic.onclick=async()=>{
    if(listening){stopListening();mic.classList.remove('on');
      setTimeout(()=>{const said=(heardFinal||P._live||'').trim();
        if(!said){heard.textContent='Didn’t catch anything. Tap the mic and try again.';return;}
        P.heard=said;finish(said);},350);
      return;}
    try{speechSynthesis.cancel();}catch(e){}
    P._live='';if(P.result){P.result=null;P.taps=0;$('#mine').innerHTML=renderLine(line.text,P.mode);}
    const ok=await startListening(t=>{if(t===null){mic.classList.remove('on');return;}P._live=t;heard.textContent=t||'Listening…';});

}

/* ========== Edit one line in place ========== */
function editLine(s,i,done){
  const l=s.lines[i];const box=document.createElement('div');box.className='sheet';
  box.innerHTML='<div role="dialog" aria-label="Edit line"><h2>Edit line</h2>'+
    '<div class="muted small">Same format as the full editor. Add more lines to split it; clear it to delete.</div>'+
    '<textarea id="lineRaw" spellcheck="false">'+esc(toRaw([l]))+'</textarea>'+
    '<div class="row"><button class="primary grow" id="lineSave">Save</button><button class="grow" id="lineCancel">Cancel</button></div></div>';
  document.body.appendChild(box);const ta=box.querySelector('#lineRaw');ta.focus();
  const close=(changed)=>{box.remove();done&&done(changed);};
  box.querySelector('#lineCancel').onclick=()=>close(false);
  box.onclick=e=>{if(e.target===box)close(false);};

/* ========== Read through ========== */
let readMode='full',readSkip=true,readOpen=new Set();
function Read(){
  const s=getScript(view.id);if(!s)return go({name:'home'});
  const blocks=[];let run=[];
  const lineHtml=(l)=>{const me=isMine(s,l);const st=me?statFor(s,l):null;const li=s.lines.indexOf(l);
    if(!l.who)return '<div class="dir editable" data-li="'+li+'">'+renderLine(l.text,'full')+'</div>';
    return '<div class="readline editable'+(me?' me':'')+'" data-li="'+li+'"><div class="row"><span class="who grow">'+esc(l.who)+'</span>'+(me?pill(st?st.last:null):'')+'</div><div>'+renderLine(l.text,me?readMode:(readMode==='letters'?'letters':'full'))+'</div></div>';};
  const flush=(i)=>{if(!run.length)return;
    if(readSkip&&run.length>=4&&!readOpen.has(run[0].i)){const keep=run.slice(-1);const hid=run.slice(0,-1);
      const who=[...new Set(hid.map(r=>r.l.who).filter(Boolean))].slice(0,4).join(', ');
      blocks.push('<button class="skipbar" data-open="'+run[0].i+'">⋯ '+hid.length+' lines'+(who?' ('+esc(who)+')':'')+' · show</button>');keep.forEach(r=>blocks.push(lineHtml(r.l)));}
    else run.forEach(r=>blocks.push(lineHtml(r.l)));run=[];};
  const [lo,hi]=rangeOf(s,view.sec);
  s.lines.forEach((l,i)=>{if(i<lo||i>=hi)return;if(l.who==='#'){flush(i);blocks.push('<h2 style="padding:14px 0 4px">'+esc(l.text)+'</h2>');return;}if(isMine(s,l)){flush(i);blocks.push(lineHtml(l));}else run.push({l,i});});flush();
  app.innerHTML=header(secTitle(s),true)+
    '<div class="seg" role="group">'+[['full','Full'],['letters','First letters'],['hidden','Hide mine']].map(m=>'<button data-mode="'+m[0]+'" aria-pressed="'+(readMode===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<label class="toggle"><input type="checkbox" id="skip" '+(readSkip?'checked':'')+'> Fold away long stretches I’m not in</label><div class="muted small">Tap any line to edit it.</div>'+
    '<div class="card" style="gap:0">'+blocks.join('')+'</div>';
  bindBack({name:'ceremony',id:s.id});
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{readMode=b.dataset.mode;Read();});
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{readOpen.add(+b.dataset.open);Read();});
  app.querySelectorAll('[data-li]').forEach(d=>d.onclick=()=>editLine(s,+d.dataset.li,ch=>{if(ch)Read();}));
  $('#skip').onchange=e=>{readSkip=e.target.checked;readOpen.clear();Read();};
}

/* ========== Rehearse (hands-free: it reads the others, listens to you) ========== */
let R=null,wakeLock=null;
function beep(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||880;g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+(d||0.15));o.connect(g).connect(actx.destination);o.start(t);o.stop(t+(d||0.15));}catch(e){}}
function say(text,rate){return new Promise(res=>{try{if(!text||!window.speechSynthesis)return res();const u=new SpeechSynthesisUtterance(text);u.lang=state.settings.lang;u.rate=rate||state.settings.rate;
  let done=false;const fin=()=>{if(!done){done=true;res();}};u.onend=fin;u.onerror=fin;speechSynthesis.cancel();speechSynthesis.speak(u);
  setTimeout(fin,Math.max(4000,text.length*120));}catch(e){res();}});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function spokenText(l){return words(l.text).map(w=>w.secret?w.letter:w.name?'':w.raw).join(' ').replace(/\s+/g,' ').trim();}
function actText(l){return tokens(l.text).filter(t=>t.kind==='act').map(t=>t.raw).join('. ');}
async function knocks(n){for(let i=0;i<n;i++){knockSound();await wait(450);}}

function Rehearse(){
  const s=getScript(view.id);if(!s)return go({name:'home'});
  if(!R||R.id!==s.id||R.sec!==view.sec){const [lo,hi]=rangeOf(s,view.sec);R={id:s.id,sec:view.sec,lo,hi,i:lo,running:false,paused:false,results:[],token:0};}
  drawRehearse();
}
function drawRehearse(status){
  const s=getScript(R.id);const l=s.lines[R.i];const mine=l&&isMine(s,l);
  const done=R.i>=R.hi;
  const avg=R.results.length?Math.round(R.results.reduce((a,b)=>a+b.score,0)/R.results.length):null;
  const nK=l?knockTotal(l.text):0,nW=l?words(l.text).filter(w=>!w.opt).length:0;
  app.innerHTML=header(secTitle(s),true)+
    '<div class="seg" role="group" aria-label="How much to show">'+[['full','Full'],['letters','First letters'],['hidden','Hidden']].map(m=>'<button data-mode="'+m[0]+'" aria-pressed="'+((P&&P.mode||'letters')===m[0])+'">'+m[1]+'</button>').join('')+'</div>'+
    '<div class="row small muted"><span class="grow">'+(done?'Finished':'Line '+(R.i-R.lo+1)+' of '+(R.hi-R.lo))+'</span>'+(avg!=null?'Your lines so far '+pill(avg):'')+'</div>'+
    '<div class="progress"><i style="width:'+Math.round(100*Math.min(1,(R.i-R.lo)/Math.max(1,R.hi-R.lo)))+'%"></i></div>'+
    (done?summaryHtml(s):
    '<div class="card">'+
      (l.who==='#'?'<h2>'+esc(l.text)+'</h2>':
       !l.who?'<div class="dir">'+renderLine(l.text,'full')+'</div>':
       '<div><div class="who">'+esc(l.who)+(mine?' (you)':'')+'</div><div class="'+(mine?'mine':'')+'" id="rline">'+(mine?renderLine(l.text,R.reveal?'full':(P&&P.mode||'letters'),R.res):renderLine(l.text,'full'))+'</div></div>')+
      '<div class="heard" id="rstatus" aria-live="polite">'+esc(status||(R.running?'':'Tap Start. I’ll read the other parts and listen when it’s your turn.'))+'</div>'+
      (mine&&nK&&R.running?'<div class="gavelpad"><button class="gavelbtn" id="rgavel" aria-label="Knock">'+GAVEL+'</button><div class="row"><span class="taps" id="rtaps">'+(R.taps||0)+'</span><span class="muted small">of '+(R.reveal?nK:'?')+' knocks</span></div></div>':'')+
    '</div>')+
    '<div class="row">'+(done?'<button class="primary grow" id="again">Go again</button>':
      (R.running?'<button class="grow" id="pause">'+(R.paused?'Resume':'Pause')+'</button><button class="grow" id="skip">Skip ›</button>':'<button class="primary grow" id="start">'+(R.i>R.lo?'Resume':'Start')+'</button>'))+'</div>'+
    (!done?'<div class="row"><button class="ghost" id="back1">‹ Back a line</button><button class="ghost" id="editR">✎ Edit line</button><span class="grow"></span><button class="ghost" id="hint">Prompt me</button></div>':'')+
    '<div class="card small"><label class="toggle"><input type="checkbox" id="readActs" '+(state.settings.readActs?'checked':'')+'> Read the red actions aloud</label><label class="toggle"><input type="checkbox" id="retry" '+(state.settings.retry!==false?'checked':'')+'> Have another go when I get it wrong</label></div>';
  bindBack({name:'ceremony',id:R.id});
  const b=document.getElementById('back');if(b){const o=b.onclick;b.onclick=()=>{stopRehearse();o();};}

  const st=$('#start');if(st)st.onclick=()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{});}catch(e){}
    R.running=true;R.paused=false;run();};
  const pa=$('#pause');if(pa)pa.onclick=()=>{if(R.paused){R.paused=false;run();}else{R.paused=true;R.token++;stopListening();try{speechSynthesis.cancel()}catch(e){}drawRehearse('Paused');}};
  const sk=$('#skip');if(sk)sk.onclick=()=>{R.token++;stopListening();try{speechSynthesis.cancel()}catch(e){}R.i++;R.res=null;R.reveal=false;R.taps=0;run();};
  const bk=$('#back1');if(bk)bk.onclick=()=>{R.token++;stopListening();try{speechSynthesis.cancel()}catch(e){}R.i=Math.max(R.lo,R.i-1);while(R.i>R.lo&&!isSpoken(s.lines[R.i]))R.i--;R.res=null;R.reveal=false;R.taps=0;if(R.running&&!R.paused)run();else drawRehearse();};
  const hn=$('#hint');if(hn)hn.onclick=()=>{R.wantHint=true;};
  const er=$('#editR');if(er)er.onclick=()=>{const s2=getScript(R.id);if(!s2.lines[R.i])return;const wasRunning=R.running&&!R.paused;R.token++;R.paused=true;stopListening();try{speechSynthesis.cancel()}catch(e){}
    editLine(s2,R.i,ch=>{const [lo,hi]=rangeOf(s2,view.sec);R.lo=lo;R.hi=hi;R.res=null;R.reveal=false;R.taps=0;drawRehearse(wasRunning?'Paused. Tap Resume to carry on from this line.':'');});};
  const ag=$('#again');if(ag)ag.onclick=()=>{R=null;Rehearse();};

  const gv=$('#rgavel');if(gv)gv.onpointerdown=e=>{e.preventDefault();R.taps=(R.taps||0)+1;R.lastTap=Date.now();knockSound();$('#rtaps').textContent=R.taps;gv.classList.add('hit');setTimeout(()=>gv.classList.remove('hit'),90);};
}
function summaryHtml(s){
  const bad=R.results.filter(r=>r.score<90).sort((a,b)=>a.score-b.score).slice(0,5);
  return '<div class="card"><h2>Done</h2><p style="margin:0">'+R.results.length+' of your lines · average '+(R.results.length?pill(Math.round(R.results.reduce((a,b)=>a+b.score,0)/R.results.length)):'–')+'</p>'+
    (bad.length?'<div class="small muted">Worth another look:</div>'+bad.map(r=>'<div class="row small"><span class="grow">'+esc(spokenText(s.lines[r.i]).split(' ').slice(0,8).join(' '))+'…</span>'+pill(r.score)+'</div>').join(''):'<p class="muted small" style="margin:0">All your lines were 90% or better.</p>')+'</div>';
}
function stopRehearse(){if(R){R.token++;R.running=false;}stopListening();try{speechSynthesis.cancel()}catch(e){}try{wakeLock&&wakeLock.release();}catch(e){}}

async function run(){
  const my=++R.token;const alive=()=>R&&R.token===my&&R.running&&!R.paused&&view.name==='rehearse';
  const s=getScript(R.id);
  while(alive()&&R.i<R.hi){
    const l=s.lines[R.i];
    if(l.who==='#'){drawRehearse();await say(l.text);if(!alive())return;R.i++;continue;}
    if(!isMine(s,l)){
      drawRehearse();
      const acts=state.settings.readActs?actText(l):'';const words_=spokenText(l);const k=knockTotal(l.text);
      if(acts)await say((l.who&&l.who!=='ALL'?l.who.split('').join(' ')+' ':'')+acts,state.settings.rate*1.1);
      if(!alive())return;
      if(k)await knocks(k);
      if(!alive())return;
      if(words_&&l.who)await say(words_);
      if(!alive())return;
      R.i++;continue;
    }
    // my line
    R.res=null;R.reveal=false;R.taps=0;let tries=0,score=0;
    while(alive()){
      const nK=knockTotal(l.text),nW=words(l.text).filter(w=>!w.opt).length;
      let kOK=true,wScore=null,said='';
      if(nK){drawRehearse('Your knocks');beep(660,0.12);
        await new Promise(res=>{const t0=Date.now();const iv=setInterval(()=>{if(!alive()){clearInterval(iv);return res();}
          if(R.taps&&Date.now()-R.lastTap>1500){clearInterval(iv);res();}else if(!R.taps&&Date.now()-t0>12000){clearInterval(iv);res();}},150);});
        if(!alive())return;kOK=R.taps===nK;}
      if(nW){drawRehearse('Your line… speak now');beep(880,0.15);
        said=await listenFor(l,alive);if(!alive())return;
        const r=compare(l.text,said);wScore=r.score;R.res=r;}
      score=nW?(nK?Math.round(wScore*0.8+(kOK?20:0)):wScore):(kOK?100:0);
      R.reveal=true;
      const msg=(nK&&!kOK?'Knocks: '+R.taps+', should be '+nK+'. ':'')+(nW?(score>=90?'Good.':score>=70?'Close.':'Not quite.'):(kOK?'Good.':''));
      drawRehearse((said?'Heard: “'+said+'” · ':'')+score+'% · '+msg);
      setStat(s,l,score);
      if(score>=90||tries>=1||state.settings.retry===false){await say(score>=90?'Good':score>=70?'Close':'');break;}
      tries++;
      await say('Not quite. It goes: '+spokenText(l)+'. Try again.');if(!alive())return;
      R.res=null;R.reveal=false;R.taps=0;
    }
    if(!alive())return;
    R.results.push({i:R.i,score});
    await wait(500);R.i++;
  }
  if(R&&R.token===my&&R.i>=R.hi){R.running=false;drawRehearse();const a=R.results.length?Math.round(R.results.reduce((x,y)=>x+y.score,0)/R.results.length):0;say('Finished. Your average was '+a+' percent.');try{wakeLock&&wakeLock.release();}catch(e){}}
}
// Listen until the line is complete, or you pause. Prompts with the opening words if you stall.
function listenFor(l,alive){
  return new Promise(async res=>{
    let last='',lastAt=Date.now(),started=Date.now(),hinted=false,finished=false;
    const W=words(l.text).filter(w=>!w.opt);
    const finish=()=>{if(finished)return;finished=true;clearInterval(iv);stopListening();setTimeout(()=>res((heardFinal||last||'').trim()),300);};
    const ok=await startListening(t=>{if(t===null){finish();return;}if(t!==last){last=t;lastAt=Date.now();const st=document.getElementById('rstatus');if(st)st.textContent=t;
      const r=compare(l.text,t);const lastWord=r.res.length?r.res[r.res.length-1]:null;if(r.score>=95&&lastWord&&(lastWord.k==='ok'||lastWord.k==='close'))finish();}});
    if(!ok){finish();return;}
    const iv=setInterval(async()=>{
      if(!alive()){finish();return;}
      const idle=Date.now()-lastAt;
      if(R.wantHint||(!last&&Date.now()-started>7000&&!hinted)){R.wantHint=false;hinted=true;stopListening();
        const firstWords=W.slice(0,4).map(w=>w.raw).join(' ');
        await say(firstWords);if(!alive()){finish();return;}
        heardCarry=last;listening=true;begin();started=Date.now();lastAt=Date.now();return;}
      if(last&&idle>2600)finish();
      else if(!last&&Date.now()-started>15000)finish();
    },200);
  });
}

/* ========== Settings ========== */
function Settings(){
  const st=state.settings;
  app.innerHTML=header('Settings',true)+
    '<div class="card"><label class="toggle"><input type="checkbox" id="local" '+(st.local?'checked':'')+'> Prefer on-device speech recognition</label>'+
    '<p class="muted small" style="margin:0">When Chrome supports it, your voice is processed on the phone. Otherwise Chrome sends the audio to Google to turn it into words. Your scripts are never sent anywhere.</p>'+
    '<label class="toggle"><input type="checkbox" id="sound" '+(st.sound?'checked':'')+'> Knock sound when tapping the gavel</label></div>'+
    '<div class="card"><label for="lang">Accent</label><select id="lang">'+[['en-GB','English (UK)'],['en-US','English (US)'],['en-IE','English (Ireland)'],['en-AU','English (Australia)']].map(o=>'<option value="'+o[0]+'"'+(st.lang===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
    '<label for="rate">Cue reading speed</label><input type="range" id="rate" min="0.6" max="1.4" step="0.1" value="'+st.rate+'"></div>'+
    '<div class="card"><h2>Tips</h2><ul class="small" style="margin:0;padding-left:1.2em"><li>Secret words show as a gold letter and names as “…”. Say them, mouth them or skip them. They never count against you.</li><li>Red words are actions. They’re shown for context and never checked.</li><li>Lines with knocks show a gavel pad. Tap it the right number of times.</li><li>Rehearse is hands-free: it reads the other parts aloud, beeps when it’s your turn, listens, and moves on. Stall for a few seconds and it prompts you with your opening words.</li><li>Add to your home screen: Chrome menu ⋮ → Add to Home screen.</li></ul></div>';
  bindBack();
  $('#local').onchange=e=>{st.local=e.target.checked;save();};
  $('#sound').onchange=e=>{st.sound=e.target.checked;save();};
  $('#lang').onchange=e=>{st.lang=e.target.value;save();};
  $('#rate').onchange=e=>{st.rate=parseFloat(e.target.value);save();};
}

/* ========== Backup ========== */
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'ritual-rehearsal',v:2,saved:new Date().toISOString(),...state},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ritual-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('Backup saved to Downloads');
}
$('#importFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.scripts))throw 0;
    const have=new Set(state.scripts.map(s=>s.id));d.scripts.forEach(s=>{s.lines=s.lines.map(l=>({who:l.who,text:maskSecrets(l.text)}));if(!have.has(s.id))state.scripts.push(s);});
    state.stats=Object.assign({},d.stats||{},state.stats);save();toast('Restored '+d.scripts.length+' script(s)');render();}catch(err){toast('That file isn’t a Ritual Rehearsal backup');}};r.readAsText(f);};

render();
// Offline: cache the app itself (never your words, which live in this phone's storage)
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
